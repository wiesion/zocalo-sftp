services:
  sftp:
    image: ${SFTP_IMAGE:-wiesion/zocalo-sftp:latest}
    build:
      context: ../..
    ports:
      - "127.0.0.1:2222:22"
      - "[::1]:2222:22"

    environment:
      # Certificate-only authentication: users must present a valid certificate
      # signed by the trusted CA. No individual authorized_keys are required.
      SFTP_AUTH_MODE: "cert"

      SSHD_LOG_LEVEL: INFO
      SFTP_LOG_LEVEL: ERROR

    secrets:
      - ssh_host_ed25519_key
      - ssh_user_ca.pub

    volumes:
      # Project data
      - ./data:/sftp-jail/projects

      # User/project config and SSH drop-in overrides (config/ contains both
      # sftp_users.conf, sftp_projects.conf, and sshd_config.d/)
      - ./config:/config:ro

    restart: unless-stopped

    # Container hardening: drop all Linux capabilities, then add back only
    # what sshd and the startup script actually need.
    # no-new-privileges prevents SUID binaries from escalating.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # chown calls during user/project setup
      - DAC_OVERRIDE     # read/write /etc/shadow (mode 0000 on wolfi)
      - MKNOD            # create device nodes in the chroot jail
      - NET_BIND_SERVICE # bind to port 22
      - SETGID           # group operations and sshd privilege separation
      - SETUID           # user operations and sshd privilege separation
      - SYS_CHROOT       # sshd ChrootDirectory for the SFTP jail
    security_opt:
      - no-new-privileges:true

secrets:
  ssh_host_ed25519_key:
    file: ./secrets/ssh_host_ed25519_key
  ssh_user_ca.pub:
    file: ./secrets/ssh_user_ca.pub
