# Certificate authentication is configured via SFTP_AUTH_MODE=cert in compose.yml; this drop-in
# is not required. It is an optional reference for operators who want to add
# AuthorizedPrincipalsFile or AuthorizedPrincipalsCommand for fine-grained principal control:
#
#   AuthorizedPrincipalsFile /run/secrets/%u.principals
#   AuthorizedPrincipalsCommand /usr/local/bin/check-principals %u %k
#
# To activate a drop-in, mount this directory:
#   volumes:
#     - ./config/sshd_config.d:/config/sshd_config.d:ro
