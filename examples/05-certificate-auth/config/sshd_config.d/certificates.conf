# Certificate authentication is now configured natively via SFTP_AUTH_MODE=cert in compose.yml.
# This drop-in is no longer needed and is kept only as a reference for operators who want to
# add AuthorizedPrincipalsFile or AuthorizedPrincipalsCommand for fine-grained principal control:
#
#   AuthorizedPrincipalsFile /run/secrets/%u.principals
#   AuthorizedPrincipalsCommand /usr/local/bin/check-principals %u %k
#
# To activate a drop-in, mount this directory:
#   volumes:
#     - ./config/sshd_config.d:/config/sshd_config.d:ro
