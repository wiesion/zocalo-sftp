# 02-media-team.conf: relaxed limits for the media-team group.
#
# The media-team members transfer large files and keep long-running sessions,
# so they get higher session counts and a longer keepalive interval.
# This block takes precedence over the base sftp_users defaults because the
# Include directive in sshd_config is processed before the Match Group sftp_users
# block (first-match-wins).

Match Group media-team
    MaxSessions 5
    ClientAliveInterval 600
    ClientAliveCountMax 3
    MaxAuthTries 6
