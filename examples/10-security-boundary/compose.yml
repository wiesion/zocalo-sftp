services:
  sftp:
    image: ${SFTP_IMAGE:-wiesion/zocalo-sftp:latest}
    build:
      context: ../..
    ports:
      - "127.0.0.1:2222:22"
      - "[::1]:2222:22"

    environment:
      SFTP_RECONCILE_INTERVAL: "5"   # converge quickly so tests do not wait long

    secrets:
      - ssh_host_ed25519_key
      - alice.authorized_keys
      - bob.authorized_keys
      - carol.authorized_keys

    volumes:
      # Named volume (not a bind mount) so POSIX group permissions are enforced
      # on every host, including Docker Desktop where bind mounts are not.
      - projects:/sftp-jail/projects
      # Generated by test.sh; the tests rewrite these files at runtime.
      - ./config:/config:ro

    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # chown calls during user/project setup
      - DAC_OVERRIDE     # read/write /etc/shadow (mode 0000 on wolfi)
      - FSETID           # keep setgid on project directories (new files inherit the project group)
      - NET_BIND_SERVICE # bind to port 22
      - SETGID           # group operations and sshd privilege separation
      - SETUID           # user operations and sshd privilege separation
      - SYS_CHROOT       # sshd ChrootDirectory for the SFTP jail
    security_opt:
      - no-new-privileges:true

volumes:
  projects:

secrets:
  ssh_host_ed25519_key:
    file: ./secrets/ssh_host_ed25519_key
  alice.authorized_keys:
    file: ./secrets/alice.authorized_keys
  bob.authorized_keys:
    file: ./secrets/bob.authorized_keys
  carol.authorized_keys:
    file: ./secrets/carol.authorized_keys
