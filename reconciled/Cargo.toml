[package]
name = "sftp-reconciled"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sftp-reconciled"
path = "src/main.rs"

[dependencies]
nix          = { version = "0.29", default-features = false, features = ["fs", "user"] }
sha-crypt    = "0.5"
notify       = "6"
signal-hook  = "0.4"

[profile.release]
opt-level     = "z"
lto           = true
strip         = true
codegen-units = 1
