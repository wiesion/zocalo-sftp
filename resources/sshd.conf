# Network: port, address family (derived from SSHD_ENABLE_IPV4/IPV6), and listen addresses.
# The AddressFamily directive suppresses the unused ListenAddress family; sshd ignores it silently.
Port 22
__ADDRESS_FAMILY__
ListenAddress 0.0.0.0
ListenAddress ::

# Logging: SyslogFacility is effectively ignored at runtime; the -e flag redirects all
# sshd output to stderr regardless of the configured facility.
SyslogFacility AUTH
LogLevel __SSHD_LOG_LEVEL__

# SFTP enforcement: all sessions are chrooted to /sftp-jail/ and forced into internal-sftp.
# Users land in /projects/ inside the jail. Shell access is impossible by design.
Subsystem sftp internal-sftp
ChrootDirectory /sftp-jail/
ForceCommand internal-sftp -l __SFTP_LOG_LEVEL__ -f LOCAL1 -d /projects

# Host key: ed25519 only, mounted as the Docker secret ssh_host_ed25519_key.
HostKey /run/secrets/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519

# Key exchange: post-quantum (sntrup761) and Curve25519 only; all legacy algorithms excluded.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

# Ciphers: AEAD only; authentication is integral to the cipher, making a separate MAC redundant.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,chacha20-poly1305@openssh.com

# MACs: explicitly restricted even though AEAD ciphers render them unused during negotiation.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Primary access gate: only members of sftp_users may connect.
# Non-members are rejected here, before ChrootDirectory or ForceCommand are evaluated.
AllowGroups sftp_users

# Immutable security baseline: placed before the Include so drop-ins cannot override these.
PermitRootLogin no
PermitEmptyPasswords no

# Drop-in overrides: mount *.conf files at /config/sshd_config.d/ to extend or adjust the
# base configuration. Files are processed in alphanumerical order. A directive set in a drop-in
# takes precedence over the same directive in the fallback section that follows.
#
# Warning: do not add a Match Group sftp_users block in a drop-in. Because this Include is
# processed before the base Match block below, a drop-in block for the same group is evaluated
# first and could inadvertently override ChrootDirectory or ForceCommand, breaking the SFTP jail.
#
# Example naming convention:
# - 01-global.conf  : global adjustments applied before any Match block
# - 02-csuite.conf  : per-group settings (e.g. Match Group csuite)
# - 03-hr.conf      : per-group settings (e.g. Match Group hr)
Include /config/sshd_config.d/*.conf

# Global-only directives: not permitted inside Match blocks in OpenSSH 9.8+.
LoginGraceTime 10
# MaxStartups: allow more pending unauthenticated connections before throttling.
# Default (10:30:100) is too aggressive for environments with frequent health-check
# connections (e.g. Docker Desktop) that complete key exchange but don't authenticate.
MaxStartups 50:30:200
PrintMotd no

# Base settings for all SFTP users. Every user provisioned by this container is a member of
# sftp_users, so this Match block applies universally. Because the Include above is processed
# first, a drop-in that sets any of these directives for sftp_users takes precedence.
Match Group sftp_users
    # Authentication: mechanism and 2FA behaviour are controlled by SFTP_AUTH_MODE.
    PasswordAuthentication __ENABLE_PASSWORD_AUTH__
    PubkeyAuthentication __ENABLE_PUBKEY_AUTH__
    PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
    __AUTHENTICATION_METHODS_LINE__
    __TRUSTED_CA_KEYS_LINE__

    # Per-user authorized keys file; set to "none" for cert-only or password-only modes.
    AuthorizedKeysFile __AUTHORIZED_KEYS_FILE__

    # Session limits: drop-ins can relax or tighten these for specific groups.
    MaxAuthTries 3
    MaxSessions 10
    ClientAliveInterval 300
    ClientAliveCountMax 2

    # Login banner: customise by mounting a replacement file at /etc/issue.sftp.
    Banner /etc/issue.sftp

    # Disabled features: can be selectively re-enabled in a drop-in for specific groups.
    KbdInteractiveAuthentication no
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
